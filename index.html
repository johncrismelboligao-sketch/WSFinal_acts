<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <header class="page-header">
      <h1>Student Registration</h1>
      <p>Fill in every field below. Fields marked with * are required.</p>
    </header>

    <!-- Success message (hidden until every field is valid) -->
    <div id="successMessage" class="success-message" role="status" hidden></div>

    <!-- novalidate turns off the browser's built-in popups so our own JS messages are shown -->
    <form id="registrationForm" novalidate data-status="idle">

      <div class="grid">

        <!-- Student ID -->
        <div class="field">
          <label for="studentId">Student ID *</label>
          <input type="text" id="studentId" name="studentId"
                 placeholder="2026-12345"
                 data-label="Student ID"
                 data-hint="Use the format YYYY-NNNNN, for example 2026-12345."
                 autocomplete="off">
          <p class="error-message" id="studentId-error"></p>
        </div>

        <!-- Full Name -->
        <div class="field">
          <label for="fullName">Full name *</label>
          <input type="text" id="fullName" name="fullName"
                 placeholder="Juan Dela Cruz"
                 data-label="Full name"
                 autocomplete="name">
          <p class="error-message" id="fullName-error"></p>
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email"
                 placeholder="juan@school.edu.ph"
                 data-label="Email"
                 autocomplete="email">
          <p class="error-message" id="email-error"></p>
        </div>

        <!-- Phone -->
        <div class="field">
          <label for="phone">Phone number *</label>
          <input type="tel" id="phone" name="phone"
                 placeholder="09171234567"
                 data-label="Phone number"
                 data-hint="Use a Philippine mobile number: 09XXXXXXXXX (11 digits)."
                 autocomplete="tel">
          <p class="error-message" id="phone-error"></p>
        </div>

        <!-- Date of Birth -->
        <div class="field">
          <label for="dob">Date of birth *</label>
          <input type="date" id="dob" name="dob"
                 data-label="Date of birth"
                 data-min-age="15">
          <p class="error-message" id="dob-error"></p>
        </div>

        <!-- Gender -->
        <fieldset class="field" id="gender">
          <legend>Gender *</legend>
          <div class="radio-row">
            <label class="radio"><input type="radio" name="gender" value="Female"> Female</label>
            <label class="radio"><input type="radio" name="gender" value="Male"> Male</label>
            <label class="radio"><input type="radio" name="gender" value="Other"> Prefer not to say</label>
          </div>
          <p class="error-message" id="gender-error"></p>
        </fieldset>

        <!-- Program -->
        <div class="field">
          <label for="program">Program *</label>
          <select id="program" name="program" data-label="Program">
            <option value="">Select a program</option>
            <option value="BSIT">BS Information Technology</option>
            <option value="BSCS">BS Computer Science</option>
            <option value="BSIS">BS Information Systems</option>
            <option value="BSECE">BS Electronics Engineering</option>
          </select>
          <p class="error-message" id="program-error"></p>
        </div>

        <!-- Year Level -->
        <div class="field">
          <label for="yearLevel">Year level *</label>
          <select id="yearLevel" name="yearLevel" data-label="Year level">
            <option value="">Select a year level</option>
            <option value="1">1st year</option>
            <option value="2">2nd year</option>
            <option value="3">3rd year</option>
            <option value="4">4th year</option>
          </select>
          <p class="error-message" id="yearLevel-error"></p>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password *</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password"
                   data-label="Password"
                   data-hint="At least 8 characters with a letter and a number, no spaces."
                   autocomplete="new-password">
            <button type="button" class="toggle-btn" data-target="password"
                    aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p class="error-message" id="password-error"></p>
        </div>

        <!-- Confirm Password -->
        <div class="field">
          <label for="confirmPassword">Confirm password *</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword"
                   data-label="Confirm password"
                   autocomplete="new-password">
            <button type="button" class="toggle-btn" data-target="confirmPassword"
                    aria-label="Show confirm password" aria-pressed="false">Show</button>
          </div>
          <p class="error-message" id="confirmPassword-error"></p>
        </div>

        <!-- Address (full width) -->
        <div class="field full">
          <label for="address">Address *</label>
          <textarea id="address" name="address" rows="3"
                    placeholder="Street, Barangay, Municipality, Province"
                    data-label="Address"
                    data-limit="150"></textarea>
          <p class="counter" id="addressCounter">0 / 150</p>
          <p class="error-message" id="address-error"></p>
        </div>

        <!-- Agreement (full width) -->
        <div class="field full">
          <label class="checkbox">
            <input type="checkbox" id="agreement" name="agreement" data-label="Agreement">
            I confirm that the information above is correct and I agree to the school's registration policy. *
          </label>
          <p class="error-message" id="agreement-error"></p>
        </div>

      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Register</button>
        <button type="reset" class="btn secondary">Reset</button>
      </div>

    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
